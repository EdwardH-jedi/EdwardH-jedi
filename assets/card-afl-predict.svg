<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 110" width="250" height="110" role="img" aria-labelledby="t d">
<title id="t">AFL Predict — a calibration curve traced against the ideal diagonal</title>
<desc id="d">A prediction curve draws itself alongside a dashed ideal line.</desc>
<style>
@media (prefers-reduced-motion: no-preference){
.curve{stroke-dasharray:230;stroke-dashoffset:230;animation:trace 4.5s ease-in-out infinite}
.dot{opacity:0;animation:show 4.5s ease-out infinite}
.dot:nth-of-type(2){animation-delay:.35s}
.dot:nth-of-type(3){animation-delay:.7s}
.dot:nth-of-type(4){animation-delay:1.05s}
.dot:nth-of-type(5){animation-delay:1.4s}
@keyframes trace{0%,8%{stroke-dashoffset:230}60%,100%{stroke-dashoffset:0}}
@keyframes show{0%,12%{opacity:0}40%,100%{opacity:1}}
}
</style>
