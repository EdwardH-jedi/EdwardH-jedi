  <text x="38" y="495" class="m" fill="#657174" font-size="9">THE README SHOWS A PSEUDO-3D SNAPSHOT. THE DEVELOPER HUB VERSION SHOULD BECOME REAL THREE.JS WITH HOVER, CLICK, ROTATE, MOBILE FALLBACK, AND REDUCED-MOTION SUPPORT.</text>
