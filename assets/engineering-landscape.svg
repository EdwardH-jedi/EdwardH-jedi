<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Edward engineering landscape</title>
  <desc id="desc">Pseudo-3D engineering landscape linking public systems, project domains, and GitHub Brain as a future system core.</desc>
  <style>
    .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.s{font-family:Inter,Arial,Helvetica,sans-serif}
    .pulse{animation:pulse 3.4s ease-in-out infinite}.dash{stroke-dasharray:5 9;animation:dash 6s linear infinite}.float1{animation:float 7s ease-in-out infinite}.float2{animation:float 8s ease-in-out 1.2s infinite}.float3{animation:float 7.4s ease-in-out 2s infinite}
    @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}@keyframes dash{to{stroke-dashoffset:-56}}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
    @media(prefers-reduced-motion:reduce){.pulse,.dash,.float1,.float2,.float3{animation:none}}
  </style>
  <rect width="1200" height="520" rx="10" fill="#0a0d0e"/>
  <path d="M38 54H1162M38 470H1162" stroke="#30383b"/>
