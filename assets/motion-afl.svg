<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 270 190" width="270" height="190"
     role="img" aria-labelledby="t d">
  <title id="t">AFL Predict — match data becomes a scored prediction</title>
  <desc id="d">A ball crosses the centre line between two opposing sides. A confidence bar fills as it travels, then the prediction is marked against the actual result. Backtested on past seasons, not live.</desc>
  <style>
    .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .fig{fill:none;stroke:#98a3a6;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}
    .acc{fill:none;stroke:#78d0c8;stroke-linecap:round;stroke-linejoin:round}
    /* Ball crosses, confidence fills behind it, verdict lands. Nothing else moves. */
    .ball{animation:kick 7s cubic-bezier(.4,0,.5,1) infinite}
    /* fill-box anchors the scale to the bar's own left edge; the default
       view-box origin resolves against the viewport, not the element. */
    .conf{transform-box:fill-box;transform-origin:left center;animation:fill 7s cubic-bezier(.4,0,.5,1) infinite}
    .verdict{opacity:0;animation:settle 7s linear infinite}
    @keyframes kick{
      0%,8%   {transform:translate(0,0);opacity:1}
      32%     {transform:translate(38px,-24px)}
      56%,74% {transform:translate(76px,0);opacity:1}
      82%,90% {transform:translate(76px,0);opacity:0}
      91%,94% {transform:translate(0,0);opacity:0}
      98%,100%{transform:translate(0,0);opacity:1}
    }
    @keyframes fill{0%,8%{transform:scaleX(.05)}56%,88%{transform:scaleX(1)}96%,100%{transform:scaleX(.05)}}
    @keyframes settle{0%,58%{opacity:0}66%,88%{opacity:1}95%,100%{opacity:0}}
    @media(prefers-reduced-motion:reduce){
      .ball,.conf,.verdict{animation:none}
      .ball{transform:translate(76px,0)}.conf{transform:scaleX(1)}.verdict{opacity:1}
    }
  </style>

  <rect width="270" height="190" rx="6" fill="#0a0d0e"/>
  <text class="m" x="14" y="21" font-size="8.5" letter-spacing="1.3" fill="#78d0c8">AIML—01</text>
  <text class="m" x="70" y="21" font-size="8.5" letter-spacing="1.3" fill="#f1efe8">AFL PREDICT</text>
  <text class="m" x="14" y="35" font-size="8" letter-spacing="0.6" fill="#8b9498">DATA · MODEL · EVALUATION</text>
  <line x1="14" y1="45" x2="256" y2="45" stroke="#22292c"/>

  <line x1="24" y1="130" x2="246" y2="130" stroke="#30383b"/>
  <line x1="135" y1="70" x2="135" y2="130" stroke="#22292c" stroke-dasharray="3 5"/>
  <path d="M30 106v24M40 106v24M230 106v24M240 106v24" stroke="#30383b" stroke-width="1.1"/>

  <g class="fig" transform="translate(70 94)">
    <circle cx="0" cy="0" r="5"/>
    <path d="M0 6v18M0 11l-8 5M0 11l8 5M0 24l-6 12M0 24l6 12"/>
  </g>
  <g class="fig" transform="translate(186 94)">
    <circle cx="0" cy="0" r="5"/>
    <path d="M0 6v18M0 11l-8 5M0 11l8 5M0 24l-6 12M0 24l6 12"/>
  </g>

  <g class="ball">
    <ellipse cx="88" cy="106" rx="5.5" ry="3.6" class="acc" stroke-width="1.4"
             transform="rotate(-24 88 106)"/>
  </g>

  <g transform="translate(0 145)">
    <rect x="14" y="0" width="126" height="4" rx="2" fill="#22292c"/>
    <rect class="conf" x="14" y="0" width="126" height="4" rx="2" fill="#78d0c8"/>
  </g>
  <text class="m" x="14" y="140" font-size="7.5" letter-spacing="1" fill="#8b9498">CONFIDENCE</text>

  <g class="verdict" transform="translate(232 147)">
    <circle cx="0" cy="0" r="7.5" class="acc" stroke-width="1.2"/>
    <path d="M-3.2 0l2.4 2.4 4.8-5.2" class="acc" stroke-width="1.3"/>
  </g>

  <line x1="14" y1="162" x2="256" y2="162" stroke="#22292c"/>
  <text class="m" x="14" y="178" font-size="8" letter-spacing="1.1" fill="#8b9498">BACKTESTED · NOT LIVE</text>
  <text class="m" x="256" y="178" font-size="8" letter-spacing="1.1" fill="#78d0c8" text-anchor="end">VERIFYING</text>
</svg>
