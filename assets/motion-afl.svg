<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">AFL Predict miniature model flow</title>
  <desc id="desc">Predictive models send independent outputs into a weighted ensemble, which produces a final prediction.</desc>
  <style>
    .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.s{font-family:Inter,Arial,Helvetica,sans-serif}
    .flow{stroke:#78d0c8;stroke-width:1.5;stroke-dasharray:4 8;animation:flow 3.8s linear infinite}.pulse{animation:pulse 3s ease-in-out infinite}
    @keyframes flow{to{stroke-dashoffset:-48}}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
    @media(prefers-reduced-motion:reduce){.flow,.pulse{animation:none}}
  </style>
  <rect width="900" height="300" rx="8" fill="#0a0d0e"/>
  <path d="M28 48H872M28 264H872" stroke="#30383b"/>
  <text x="28" y="30" class="m" fill="#778286" font-size="11" letter-spacing="1.6">AIML—01 / AFL PREDICT / MODEL FLOW</text>
  <text x="872" y="30" text-anchor="end" class="m" fill="#78d0c8" font-size="9">PREDICTORS → ENSEMBLE → FINAL</text>

  <g class="m" font-size="9" text-anchor="middle" fill="none" stroke="#98a3a6" stroke-linecap="round">
    <g transform="translate(92 88)"><circle r="8"/><path d="M0 9v28m0-17-11 8m11-8 12 7M0 37-9 55M0 37l10 18"/><text x="0" y="76" fill="#e5e6e1" stroke="none">ELO</text></g>
    <g transform="translate(220 88)"><circle r="8"/><path d="M0 9v28m0-17-10 6m10-6 11 9M0 37-9 55M0 37l10 18"/><text x="0" y="76" fill="#e5e6e1" stroke="none">LOGISTIC</text></g>
    <g transform="translate(348 88)"><circle r="8"/><path d="M0 9v28m0-17-11 7m11-7 12 7M0 37-9 55M0 37l10 18"/><text x="0" y="76" fill="#e5e6e1" stroke="none">XGBOOST</text></g>
    <g transform="translate(476 88)"><circle r="8"/><path d="M0 9v28m0-17-10 9m10-9 12 5M0 37-9 55M0 37l10 18"/><text x="0" y="76" fill="#e5e6e1" stroke="none">POISSON</text></g>
  </g>

  <g fill="none" class="flow">
    <path d="M92 174C170 201 360 204 574 194"/>
    <path d="M220 174C300 195 430 198 574 194"/>
    <path d="M348 174C430 187 500 190 574 194"/>
    <path d="M476 174C520 180 548 187 574 194"/>
  </g>

  <g transform="translate(636 194)"><rect x="-62" y="-31" width="124" height="62" rx="6" fill="#101517" stroke="#78d0c8"/><text x="0" y="-3" text-anchor="middle" class="s" fill="#f1efe8" font-size="15" font-weight="700">ENSEMBLE</text><text x="0" y="16" text-anchor="middle" class="m" fill="#8d989b" font-size="8">WEIGHTED COMBINATION</text></g>
  <path d="M698 194H770" class="flow" fill="none"/>
  <g transform="translate(818 194)"><circle r="31" fill="#101517" stroke="#3c474a"/><circle r="5" fill="#78d0c8" class="pulse"/><text x="0" y="48" text-anchor="middle" class="m" fill="#dfe2de" font-size="9">FINAL PREDICTION</text></g>

  <text x="28" y="286" class="m" fill="#657174" font-size="8.5">PREDICTIVE MODELS, NOT AGENTS · NO INVENTED PROBABILITIES OR WEIGHTS.</text>
</svg>
