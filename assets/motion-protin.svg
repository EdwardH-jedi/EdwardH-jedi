<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 270 190" width="270" height="190"
     role="img" aria-labelledby="t d">
  <title id="t">Protin — two players passing a ball</title>
  <desc id="d">Two figures stand either side of a court line. A ball travels from one to the other along a low arc, and a match is logged. Peer sports: find an opponent, play, record the result.</desc>
  <style>
    .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .fig{fill:none;stroke:#98a3a6;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}
    .acc{fill:none;stroke:#78d0c8;stroke-linecap:round;stroke-linejoin:round}
    /* Two moving parts: the ball, and the match it completes. */
    .ball{animation:pass 6s cubic-bezier(.45,0,.55,1) infinite}
    .tick{opacity:0;animation:logged 6s linear infinite}
    @keyframes pass{
      0%,8%   {transform:translate(0,0);opacity:1}
      30%     {transform:translate(43px,-26px)}
      54%,72% {transform:translate(86px,0);opacity:1}
      80%,88% {transform:translate(86px,0);opacity:0}
      89%,92% {transform:translate(0,0);opacity:0}
      98%,100%{transform:translate(0,0);opacity:1}
    }
    @keyframes logged{0%,56%{opacity:0}64%,86%{opacity:1}94%,100%{opacity:0}}
    @media(prefers-reduced-motion:reduce){
      .ball,.tick{animation:none}
      .ball{transform:translate(86px,0)}.tick{opacity:1}
    }
  </style>

  <rect width="270" height="190" rx="6" fill="#0a0d0e"/>
  <text class="m" x="14" y="21" font-size="8.5" letter-spacing="1.3" fill="#78d0c8">FS—01</text>
  <text class="m" x="52" y="21" font-size="8.5" letter-spacing="1.3" fill="#f1efe8">PROTIN</text>
  <text class="m" x="14" y="35" font-size="8" letter-spacing="0.6" fill="#8b9498">PEER SPORTS · MATCH · RANK</text>
  <line x1="14" y1="45" x2="256" y2="45" stroke="#22292c"/>

  <line x1="30" y1="136" x2="240" y2="136" stroke="#30383b"/>
  <line x1="135" y1="72" x2="135" y2="136" stroke="#22292c" stroke-dasharray="3 5"/>

  <g class="fig" transform="translate(74 100)">
    <circle cx="0" cy="0" r="5"/>
    <path d="M0 6v18M0 11l-8 5M0 11l8 5M0 24l-6 12M0 24l6 12"/>
  </g>
  <g class="fig" transform="translate(196 100)">
    <circle cx="0" cy="0" r="5"/>
    <path d="M0 6v18M0 11l-8 5M0 11l8 5M0 24l-6 12M0 24l6 12"/>
  </g>

  <g class="ball"><circle cx="92" cy="112" r="4.5" class="acc" stroke-width="1.4"/></g>

  <g class="tick" transform="translate(200 66)">
    <circle cx="0" cy="0" r="7.5" class="acc" stroke-width="1.2"/>
    <path d="M-3.2 0l2.4 2.4 4.8-5.2" class="acc" stroke-width="1.3"/>
  </g>

  <line x1="14" y1="158" x2="256" y2="158" stroke="#22292c"/>
  <text class="m" x="14" y="176" font-size="8" letter-spacing="1.1" fill="#8b9498">PUBLIC SOURCE</text>
  <text class="m" x="256" y="176" font-size="8" letter-spacing="1.1" fill="#78d0c8" text-anchor="end">ACTIVE</text>
</svg>
