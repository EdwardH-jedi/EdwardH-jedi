<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">Protin miniature social sports flow</title>
  <desc id="desc">Individual activity becomes discovery, matching, and a small group sports session.</desc>
  <style>
    .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.wave{stroke:#78d0c8;stroke-width:1.4;stroke-dasharray:4 9;animation:wave 4.2s linear infinite}.pulse{animation:pulse 3s ease-in-out infinite}
    @keyframes wave{to{stroke-dashoffset:-52}}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
    @media(prefers-reduced-motion:reduce){.wave,.pulse{animation:none}}
  </style>
  <rect width="900" height="300" rx="8" fill="#0a0d0e"/>
  <path d="M28 48H872M28 264H872" stroke="#30383b"/>
  <text x="28" y="30" class="m" fill="#778286" font-size="11" letter-spacing="1.6">FS—01 / PROTIN / SOCIAL SPORTS FLOW</text>
  <text x="872" y="30" text-anchor="end" class="m" fill="#78d0c8" font-size="9">ACTIVITY → DISCOVERY → MATCH → GROUP</text>

  <g transform="translate(92 90)"><circle r="8" fill="none" stroke="#9ca6a9"/><path d="M0 9v28m0-17-11 6m11-6 12 8M0 37-9 55M0 37l10 18" stroke="#9ca6a9" fill="none" stroke-linecap="round"/><circle cx="18" cy="23" r="6" fill="none" stroke="#657174"/><text x="0" y="76" text-anchor="middle" class="m" fill="#dfe2de" font-size="9">TRAIN</text></g>
  <path d="M150 162H270" class="wave" fill="none"/>

  <g transform="translate(330 80)"><rect x="-48" y="-14" width="96" height="110" rx="7" fill="#101517" stroke="#3c474a"/><circle cx="0" cy="10" r="20" fill="none" stroke="#78d0c8"/><path d="M-10 10h20M0 0v20" stroke="#78d0c8"/><text x="0" y="62" text-anchor="middle" class="m" fill="#f1efe8" font-size="9">DISCOVER</text><text x="0" y="78" text-anchor="middle" class="m" fill="#8e999c" font-size="8">people / sessions</text></g>
  <path d="M378 162H500" class="wave" fill="none"/>

  <g transform="translate(560 95)"><circle cx="-28" cy="0" r="8" fill="none" stroke="#9ca6a9"/><path d="M-28 9v26m0-15-10 7m10-7 10 7m-10 8-9 18m9-18 9 18" stroke="#9ca6a9" fill="none"/><circle cx="28" cy="0" r="8" fill="none" stroke="#9ca6a9"/><path d="M28 9v26m0-15-10 7m10-7 10 7m-10 8-9 18m9-18 9 18" stroke="#9ca6a9" fill="none"/><path d="M-13 12H13" stroke="#78d0c8" class="pulse"/><text x="0" y="74" text-anchor="middle" class="m" fill="#dfe2de" font-size="9">MATCH</text></g>
  <path d="M620 162H728" class="wave" fill="none"/>

  <g transform="translate(790 100)"><g transform="translate(-30 4)"><circle r="7" fill="none" stroke="#9ca6a9"/><path d="M0 8v22m0-13-9 6m9-6 9 6M0 30-8 46M0 30l8 16" stroke="#9ca6a9" fill="none"/></g><g transform="translate(0 -3)"><circle r="7" fill="none" stroke="#9ca6a9"/><path d="M0 8v22m0-13-9 6m9-6 9 6M0 30-8 46M0 30l8 16" stroke="#9ca6a9" fill="none"/></g><g transform="translate(30 5)"><circle r="7" fill="none" stroke="#9ca6a9"/><path d="M0 8v22m0-13-9 6m9-6 9 6M0 30-8 46M0 30l8 16" stroke="#9ca6a9" fill="none"/></g><path d="M-44 58H44" stroke="#3c474a"/><circle cx="0" cy="58" r="4" fill="#78d0c8" class="pulse"/><text x="0" y="82" text-anchor="middle" class="m" fill="#dfe2de" font-size="9">GROUP SESSION</text></g>

  <text x="28" y="286" class="m" fill="#657174" font-size="8.5">SOCIAL SPORTS DISCOVERY · HUMAN COORDINATION · NO FAKE USAGE METRICS.</text>
</svg>
