<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">Wardrobe miniature product flow</title>
  <desc id="desc">Garment capture flows into a local archive, outfit composition, and an experimental proxy-3D stage.</desc>
  <style>
    .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.flow{stroke:#78d0c8;stroke-width:1.5;stroke-dasharray:5 9;animation:flow 4.4s linear infinite}.pulse{animation:pulse 3.2s ease-in-out infinite}
    @keyframes flow{to{stroke-dashoffset:-56}}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
    @media(prefers-reduced-motion:reduce){.flow,.pulse{animation:none}}
  </style>
  <rect width="900" height="300" rx="8" fill="#0a0d0e"/>
  <path d="M28 48H872M28 264H872" stroke="#30383b"/>
  <text x="28" y="30" class="m" fill="#778286" font-size="11" letter-spacing="1.6">APP—01 / WARDROBE / PRODUCT FLOW</text>
  <text x="872" y="30" text-anchor="end" class="m" fill="#78d0c8" font-size="9">CAPTURE → ARCHIVE → COMPOSE → PROXY 3D</text>

  <g transform="translate(62 80)"><path d="M0 0h100M16 0v88M84 0v88" stroke="#3b464a" fill="none"/><path d="M35 18c4-7 10-10 15-10s11 3 15 10l15 15-13 11-7-8v49H40V36l-7 8-13-11z" fill="none" stroke="#9ca6a9"/><text x="50" y="110" text-anchor="middle" class="m" fill="#dfe2de" font-size="9">GARMENT</text></g>
  <path d="M184 166H278" class="flow" fill="none"/>

  <g transform="translate(300 74)"><rect width="148" height="148" rx="7" fill="#101517" stroke="#3c474a"/><rect x="18" y="18" width="112" height="74" rx="4" fill="none" stroke="#657174"/><path d="M58 38c4-6 9-9 16-9s12 3 16 9l12 12-10 9-6-7v30H62V52l-6 7-10-9z" fill="none" stroke="#9ca6a9"/><text x="18" y="118" class="m" fill="#78d0c8" font-size="8.5">LOCAL ARCHIVE</text><text x="18" y="134" class="m" fill="#8e999c" font-size="8.5">metadata + image</text></g>
  <path d="M448 166H546" class="flow" fill="none"/>

  <g transform="translate(568 77)"><rect width="132" height="142" rx="7" fill="#101517" stroke="#3c474a"/><path d="M45 22h42l13 15-12 10-6-7v32H50V40l-6 7-12-10z" fill="none" stroke="#9ca6a9"/><path d="M45 88h42l8 32H37z" fill="none" stroke="#657174"/><text x="66" y="132" text-anchor="middle" class="m" fill="#dfe2de" font-size="9">OUTFIT</text></g>
  <path d="M700 166H774" class="flow" fill="none"/>

  <g transform="translate(824 166)"><path d="M0-45 34-25 34 16 0 36-34 16-34-25z" fill="#101517" stroke="#78d0c8"/><path d="M0-45v81M-34-25 34 16M34-25-34 16" stroke="#3f4a4e" fill="none"/><circle r="5" fill="#78d0c8" class="pulse"/><text x="0" y="58" text-anchor="middle" class="m" fill="#dfe2de" font-size="8.5">PROXY 3D / EXP.</text></g>

  <text x="28" y="286" class="m" fill="#657174" font-size="8.2">LOCAL-FIRST · PROXY 3D IS EXPERIMENTAL, NOT BODY FITTING, CLOTH SIMULATION, OR VIRTUAL TRY-ON.</text>
</svg>
