<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 270 190" width="270" height="190"
     role="img" aria-labelledby="t d">
  <title id="t">Wardrobe — a garment moves from the rail into an outfit</title>
  <desc id="d">Three garments hang on an archive rail. One lifts out and settles into an outfit frame, where a fit check confirms it. Catalogue a garment, compose an outfit, inspect the fit — all stored in the browser.</desc>
  <style>
    .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .g{fill:none;stroke:#98a3a6;stroke-width:1.3;stroke-linejoin:round}
    .acc{fill:none;stroke:#78d0c8;stroke-linecap:round;stroke-linejoin:round}
    /* One garment moves; one check answers it. */
    .pick{animation:compose 7s cubic-bezier(.4,0,.4,1) infinite}
    .fit{opacity:0;animation:checked 7s linear infinite}
    @keyframes compose{
      0%,12%  {transform:translate(0,0);opacity:1}
      28%     {transform:translate(10px,-16px)}
      54%,74% {transform:translate(133px,4px);opacity:1}
      82%,92% {transform:translate(133px,4px);opacity:0}
      98%,100%{transform:translate(0,0);opacity:1}
    }
    @keyframes checked{0%,56%{opacity:0}64%,88%{opacity:1}95%,100%{opacity:0}}
    @media(prefers-reduced-motion:reduce){
      .pick,.fit{animation:none}
      .pick{transform:translate(133px,4px)}.fit{opacity:1}
    }
  </style>

  <rect width="270" height="190" rx="6" fill="#0a0d0e"/>
  <text class="m" x="14" y="21" font-size="8.5" letter-spacing="1.3" fill="#78d0c8">APP—01</text>
  <text class="m" x="58" y="21" font-size="8.5" letter-spacing="1.3" fill="#f1efe8">WARDROBE</text>
  <text class="m" x="14" y="35" font-size="8" letter-spacing="0.6" fill="#8b9498">ARCHIVE · OUTFIT · FIT CHECK</text>
  <line x1="14" y1="45" x2="256" y2="45" stroke="#22292c"/>

  <!-- archive rail, three slots -->
  <line x1="22" y1="64" x2="116" y2="64" stroke="#30383b"/>
  <g class="g">
    <path d="M40 64v6"/>
    <path d="M34 73L40 76L46 73L50 78L46 81L45 79L45 100L35 100L35 79L34 81L30 78Z"/>
    <path d="M96 64v6"/>
    <path d="M90 73L96 76L102 73L106 78L102 81L101 79L101 100L91 100L91 79L90 81L86 78Z"/>
  </g>
  <text class="m" x="22" y="118" font-size="7.5" letter-spacing="1" fill="#8b9498">ARCHIVE</text>

  <!-- outfit frame -->
  <rect x="170" y="60" width="62" height="72" rx="3" fill="none" stroke="#30383b" stroke-dasharray="4 4"/>
  <text class="m" x="170" y="146" font-size="7.5" letter-spacing="1" fill="#8b9498">OUTFIT</text>

  <!-- the garment that moves: rail slot three, into the frame -->
  <g class="pick">
    <path d="M62 64v6" class="acc" stroke-width="1.3"/>
    <path d="M56 73L62 76L68 73L72 78L68 81L67 79L67 100L57 100L57 79L56 81L52 78Z"
          class="acc" stroke-width="1.4"/>
  </g>

  <g class="fit" transform="translate(222 70)">
    <circle cx="0" cy="0" r="7.5" class="acc" stroke-width="1.2"/>
    <path d="M-3.2 0l2.4 2.4 4.8-5.2" class="acc" stroke-width="1.3"/>
  </g>

  <line x1="14" y1="162" x2="256" y2="162" stroke="#22292c"/>
  <text class="m" x="14" y="178" font-size="8" letter-spacing="1.1" fill="#8b9498">PUBLIC SOURCE</text>
  <text class="m" x="256" y="178" font-size="8" letter-spacing="1.1" fill="#78d0c8" text-anchor="end">BUILDING</text>
</svg>
