<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460"
     role="img" aria-label="System map: six systems Edward builds, with their type, surface and current state.">
  <title>System map — six active systems</title>
  <desc>BYTE, a native macOS organism, local build. Wardrobe, a local-first product, public. AFL Predict, a research system, public. Protin, a full-stack platform, public. Developer Hub, a portfolio surface, private build. GitHub Brain, a local intelligence layer, local build.</desc>

  <defs>
    <style>
      .plate  { fill: #0d1117; }
      .rule   { stroke: #21262d; stroke-width: 1; }
      .spine  { stroke: #30363d; stroke-width: 1; }
      .label  { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, monospace;
                font-size: 11px; letter-spacing: 0.14em; fill: #6e7681; }
      .name   { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, monospace;
                font-size: 17px; letter-spacing: 0.06em; fill: #e6edf3; }
      .type   { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, monospace;
                font-size: 11px; letter-spacing: 0.10em; fill: #8b949e; }
      .state  { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, monospace;
                font-size: 11px; letter-spacing: 0.12em; fill: #7ee2d0; }
      .quiet  { fill: #6e7681; }
      .node   { fill: none; stroke: #7ee2d0; stroke-width: 1.2; }
      .nodeq  { fill: none; stroke: #484f58; stroke-width: 1.2; }
      .head   { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, monospace;
                font-size: 11px; letter-spacing: 0.18em; fill: #6e7681; }
    </style>
  </defs>

  <rect class="plate" width="1200" height="460" rx="6"/>

  <!-- header -->
  <text class="head" x="44" y="42">SYSTEM MAP / SIX SYSTEMS / STATE FROM REPOSITORY EVIDENCE</text>
  <line class="rule" x1="44" y1="62" x2="1156" y2="62"/>

  <!-- column headings -->
  <text class="label" x="44"  y="90">SYSTEM</text>
  <text class="label" x="360" y="90">TYPE</text>
  <text class="label" x="700" y="90">SURFACE</text>
  <text class="label" x="940" y="90">STATE</text>
  <line class="rule" x1="44" y1="104" x2="1156" y2="104"/>

  <!-- vertical spine linking the systems -->
  <line class="spine" x1="52" y1="132" x2="52" y2="424"/>

  <!-- 1 BYTE -->
  <line class="spine" x1="52" y1="140" x2="66" y2="140"/>
  <circle class="nodeq" cx="52" cy="140" r="3.5"/>
  <text class="name"  x="76"  y="145">BYTE</text>
  <text class="type"  x="360" y="145">NATIVE MACOS ORGANISM</text>
  <text class="type"  x="700" y="145">LOCAL BUILD</text>
  <text class="state quiet" x="940" y="145">UNPUBLISHED</text>
  <line class="rule" x1="76" y1="166" x2="1156" y2="166"/>

  <!-- 2 WARDROBE -->
  <line class="spine" x1="52" y1="196" x2="66" y2="196"/>
  <circle class="node" cx="52" cy="196" r="3.5"/>
  <text class="name"  x="76"  y="201">WARDROBE</text>
  <text class="type"  x="360" y="201">LOCAL-FIRST PRODUCT</text>
  <text class="type"  x="700" y="201">PUBLIC SOURCE</text>
  <text class="state" x="940" y="201">BUILDING</text>
  <line class="rule" x1="76" y1="222" x2="1156" y2="222"/>

  <!-- 3 AFL PREDICT -->
  <line class="spine" x1="52" y1="252" x2="66" y2="252"/>
  <circle class="node" cx="52" cy="252" r="3.5"/>
  <text class="name"  x="76"  y="257">AFL PREDICT</text>
  <text class="type"  x="360" y="257">RESEARCH SYSTEM</text>
  <text class="type"  x="700" y="257">PUBLIC SOURCE</text>
  <text class="state" x="940" y="257">VERIFYING</text>
  <line class="rule" x1="76" y1="278" x2="1156" y2="278"/>

  <!-- 4 PROTIN -->
  <line class="spine" x1="52" y1="308" x2="66" y2="308"/>
  <circle class="node" cx="52" cy="308" r="3.5"/>
  <text class="name"  x="76"  y="313">PROTIN</text>
  <text class="type"  x="360" y="313">FULL-STACK PLATFORM</text>
  <text class="type"  x="700" y="313">PUBLIC SOURCE</text>
  <text class="state" x="940" y="313">ACTIVE</text>
  <line class="rule" x1="76" y1="334" x2="1156" y2="334"/>

  <!-- 5 DEVELOPER HUB -->
  <line class="spine" x1="52" y1="364" x2="66" y2="364"/>
  <circle class="nodeq" cx="52" cy="364" r="3.5"/>
  <text class="name"  x="76"  y="369">DEVELOPER HUB</text>
  <text class="type"  x="360" y="369">PORTFOLIO SURFACE</text>
  <text class="type"  x="700" y="369">PRIVATE BUILD</text>
  <text class="state quiet" x="940" y="369">UNPUBLISHED</text>
  <line class="rule" x1="76" y1="390" x2="1156" y2="390"/>

  <!-- 6 GITHUB BRAIN -->
  <line class="spine" x1="52" y1="420" x2="66" y2="420"/>
  <circle class="nodeq" cx="52" cy="420" r="3.5"/>
  <text class="name"  x="76"  y="425">GITHUB BRAIN</text>
  <text class="type"  x="360" y="425">LOCAL INTELLIGENCE LAYER</text>
  <text class="type"  x="700" y="425">LOCAL BUILD</text>
  <text class="state quiet" x="940" y="425">UNPUBLISHED</text>
</svg>
