<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
  <title id="title">Edward Hwang engineering system map</title>
  <desc id="desc">Evidence-based map connecting engineering domains to selected public, local and academic projects.</desc>
  <style>
    .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .s{font-family:Inter,Arial,Helvetica,sans-serif}
    .flow{stroke-dasharray:3 8;animation:flow 9s linear infinite}
    .pulse{animation:pulse 3s ease-in-out infinite}
    @keyframes flow{to{stroke-dashoffset:-44}}
    @keyframes pulse{0%,100%{opacity:.42}50%{opacity:1}}
    @media (prefers-reduced-motion:reduce){.flow,.pulse{animation:none}}
  </style>
  <rect width="1200" height="470" rx="10" fill="#0a0d0e"/>
