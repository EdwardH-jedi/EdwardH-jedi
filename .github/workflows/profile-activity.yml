name: Refresh profile signal

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches:
      - main
    paths:
      - "scripts/generate_activity.py"
      - "data/brain.json"
      - "data/brain.example.json"
      - ".github/workflows/profile-activity.yml"

permissions:
  contents: write

concurrency:
  group: profile-signal
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render public-safe profile signal
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USERNAME: EdwardH-jedi
          PROFILE_TIMEZONE: Australia/Sydney
        run: python scripts/generate_activity.py

      - name: Commit generated profile data
        run: |
          if git diff --quiet -- assets/activity.svg assets/weekly-focus.svg data/activity.json; then
            echo "No public signal changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/activity.svg assets/weekly-focus.svg data/activity.json
          git commit -m "chore(profile): refresh public engineering signal [skip profile]"
          git push
