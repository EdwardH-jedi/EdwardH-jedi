name: Refresh profile signal

on:
  workflow_dispatch:
  schedule:
    # Once a day. The signal moves slowly, and a six-hourly cadence filled the
    # profile's own commit history with refresh commits.
    - cron: "17 20 * * *"
  push:
    branches:
      - main
    paths:
      - "scripts/generate_activity.py"
      - "data/brain.json"
      - "data/brain.example.json"
      - ".github/workflows/profile-activity.yml"

permissions:
  contents: write

concurrency:
  group: profile-signal
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      # Pinned to commit SHAs rather than mutable major tags: this job holds
      # contents: write, so a moved tag would be a write-capable supply chain.
      - name: Render public-safe profile signal
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USERNAME: EdwardH-jedi
          PROFILE_TIMEZONE: Australia/Sydney
        run: python scripts/generate_activity.py

      - name: Commit generated profile data
        run: |
          if git diff --quiet -- assets/activity.svg data/activity.json; then
            echo "No public signal changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/activity.svg data/activity.json
          git commit -m "chore(profile): refresh public engineering signal [skip profile]"
          git push
